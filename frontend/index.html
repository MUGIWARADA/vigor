<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vigor — context-specific football intelligence platform for analysts, scouts, coaches and researchers."
    />
    <script>
      // Apply the stored theme before first paint (avoids a dark flash in light mode).
      try {
        var s = JSON.parse(localStorage.getItem('tiq.settings') || '{}')
        if (s.theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
    <title>Vigor — Football Intelligence Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
